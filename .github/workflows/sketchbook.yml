# Redraws the hand-drawn profile (assets/sketchbook/*.svg + README.md) from live GitHub data.
name: Sketchbook

on:
  schedule:
    - cron: "17 0 * * *"        # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["profile.json", "scripts/**", "fonts/**", ".github/workflows/sketchbook.yml"]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Draw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py
      - name: Commit if anything changed
        run: |
          git config user.name "SruSanCyborg"
          git config user.email "100407273+SruSanCyborg@users.noreply.github.com"
          git add assets/sketchbook README.md
          git diff --cached --quiet || (git commit -m "Redraw sketchbook" && git push)
